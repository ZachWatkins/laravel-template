models:
  Part:
    status: enum:active,inactive default:active index
    number: string:100 index
    name: string:100
    sku: string:100
    inventory: integer
    price: decimal:8,2
    weight: decimal:8,2
    weight_unit: string:10
    filename: string:100
    published_at: nullable timestamp
    softDeletes
    relationships:
      belongsTo: PartType, Manufacturer
      hasOne: PartWebpage
      hasMany: OrderItem, PartPhoto
  PartType:
    name: string:100
    relationships:
      hasMany: Part
  PartWebpage:
    status: enum:active,inactive default:active index
    path: string:100
    title: string:100
    meta_title: string:100
    meta_description: string:255
    meta_keywords: string:255
    content: text
    relationships:
      belongsTo: Part
  Order:
    number: string:100
    status: enum:paid,pending,processing,shipped,delivered,canceled,returned,partially_refunded,refunded,completed default:pending index
    total: decimal:10,2
    notes: text
    relationships:
      belongsTo: Customer, CustomerPaymentMethod, CustomerShippingAddress, CustomerBillingAddress
      hasMany: OrderItem
  OrderItem:
    quantity: integer
    price: decimal:8,2
    relationships:
      belongsTo: Order
      belongsTo: Part
  Manufacturer:
    name: string:100
    website: string:100
    phone: string:20
    filename: string:100
    relationships:
      hasMany: Part
  Customer:
    name: string:100
    email: string:100
    phone: string:20
    address: text
    relationships:
      hasOne: CustomerShippingAddress:default_shipping_address, CustomerBillingAddress:default_billing_address, CustomerPaymentMethod:payment_method
      hasMany: Order, CustomerShippingAddress, CustomerBillingAddress
  CustomerPaymentMethod:
    name: string:100
    relationships:
      belongsTo: Customer
      hasMany: PaymentCard
  PaymentCard:
    name_on_card: string:100
    number: string:20
    expiration: string:5
    cvv: string:3
    zip_code: string:10
    relationships:
      belongsTo: Customer, City, State, CustomerPaymentMethod
  CustomerShippingAddress:
    street_1: string:100
    street_2: string:100
    zip_code: string:10
    details: text
    relationships:
      belongsTo: Customer, City, State
  CustomerBillingAddress:
    street_1: string:100
    street_2: string:100
    zip_code: string:10
    relationships:
      belongsTo: Customer, City, State
  City:
    name: string:100
    relationships:
      hasMany: CustomerBillingAddress, CustomerShippingAddress, PaymentCard
  State:
    name: string:100
    relationships:
      hasMany: CustomerBillingAddress, CustomerShippingAddress, PaymentCard

controllers:
  PartController:
    resource: paginate:parts

seeders: PartType, City, State
