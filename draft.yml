models:
  Warehouse:
    name: string:100
    description: string:400
    address_line_1: string:255
    address_line_2: string:255
    city: string:100 nullable
    state_province_region: string:100 nullable
    postal_code: string:20 nullable
    country_code: string:100 nullable
    latitude: decimal:10,8 nullable
    longitude: decimal:11,8 nullable
    space_station: string:100 nullable
    planet_or_moon: string:100 nullable
    star_system: string:100 nullable
    sector: string:100 nullable
    quadrant: string:100 nullable
  Part:
    status: enum:active,inactive default:active index
    number: string:100 index
    name: string:100
    sku: string:100
    enabled: boolean default:true
    inventory: integer
    unit_price: integer # Assume last 2 digits are cents.
    weight: integer # Assume last 2 digits are decimals.
    weight_unit: string:10
    filename: string:100
    published_at: nullable timestamp
    softDeletes
    relationships:
      belongsTo: PartType, Manufacturer
      hasOne: PartWebpage
      hasMany: OrderItem, PartInventoryMonitor, PartImage
  PartImage:
    type: enum:thumbnail,main,additional default:additional
    path: string:255
    relationships:
      belongsTo: Part
  PartType:
    name: string:100
    softDeletes
    relationships:
      hasMany: Part
  PartWebpage:
    status: enum:active,inactive default:active index
    path: string:100
    title: string:100
    meta_title: string:100
    meta_description: string:255
    meta_keywords: string:255
    content: text
    relationships:
      belongsTo: Part
  ShoppingCart:
    relationships:
      belongsTo: Customer
      belongsToMany: Part
    indexes:
      - unique: customer_id
  Order:
    number: integer default:1 index
    payment_state: enum:pending,paid,partially_refunded,refunded default:pending
    shipping_state: enum:pending,shipped,delivered,returned default:pending
    items_total: integer
    total: decimal:10,2
    token_value: string:255 nullable
    customer_ip: string:255 nullable
    created_by_guest: boolean default:false
    notes: text
    relationships:
      belongsTo: Customer, Currency, Locale
      hasMany: OrderItem
      hasOne: ShippingAddress, BillingAddress, OrderPayment
    indexes:
      - unique: customer_id, number
  OrderItem:
    quantity: integer
    unit_price: integer # Assume last 2 digits are cents.
    total: integer # Assume last 2 digits are cents.
    part_name: string:255 nullable
    relationships:
      belongsTo: Order, Part
  OrderDestination:
    address_line_1: string:255
    address_line_2: string:255
    city: string:100
    state_province_region: string:100 nullable
    postal_code: string:20 nullable
    country_code: string:100 nullable
    latitude: decimal:10,8 nullable
    longitude: decimal:11,8 nullable
    space_station: string:100 nullable
    planet_or_moon: string:100 nullable
    star_system: string:100 nullable
    sector: string:100 nullable
    quadrant: string:100 nullable
    relationships:
      belongsTo: OrderPayment
  OrderPayment:
    total: decimal:10,2
    relationships:
      belongsTo: Order
  OrderPaymentCard:
    name: string:100
    number: string:20
    expiration: string:5
    relationships:
      belongsTo: OrderPayment, BillingAddress:
  BillingAddress:
    first_name: string:255
    last_name: string:255
    phone_number: string:255 nullable
    address_line_1: string:255
    address_line_2: string:255 nullable
    company: string:255 nullable
    city: string:100 nullable
    postal_code: string:20 nullable
    country_code: string:100 nullable
    province_code: string:255 nullable
    province_name: string:255 nullable
    state_province_region: string:100
    latitude: decimal:10,8 nullable
    longitude: decimal:11,8 nullable
    space_station: string:100 nullable
    planet_or_moon: string:100 nullable
    star_system: string:100 nullable
    sector: string:100 nullable
    quadrant: string:100 nullable
  ShippingAddress:
    first_name: string:255
    last_name: string:255
    phone_number: string:255 nullable
    street: string:255
    company: string:255 nullable
    city: string:100
    postal_code: string:20
    country_code: string:100 nullable
    province_code: string:255 nullable
    province_name: string:255 nullable
    state_province_region: string:100
    latitude: decimal:10,8 nullable
    longitude: decimal:11,8 nullable
    space_station: string:100 nullable
    planet_or_moon: string:100 nullable
    star_system: string:100 nullable
    sector: string:100 nullable
    quadrant: string:100 nullable
  Customer:
    birthday: date nullable
    phone_number: string:20 nullable
    subscribed_to_newsletter: boolean default:false
    relationships:
      belongsTo: User, ShippingAddress, BillingAddress
      hasOne: ShoppingCart, CustomerPaymentMethod
      hasMany: Order
  CustomerPaymentMethod:
    card_name: string:100
    card_number: string:20
    card_expiration: string:5
    street_1: string:100
    street_2: string:100
    city: string:100
    state: string:100
    zip_code: string:10
    relationships:
      belongsTo: Customer
  Manufacturer:
    name: string:100
    description: string:400
    filename: string:100
    softDeletes
    relationships:
      hasMany: Part
  PartInventoryMonitor:
    active: boolean default:true
    threshold: integer default:10
    relationships:
      hasMany: Part, MonitorSubscriber
  PartInventoryMonitorSubscriber:
    name: string:100
    email: string:100
    relationships:
      belongsTo: PartInventoryMonitor
  Currency:
    id: false
    code: string:3 primary
    name: string:100
    symbol: string:10
    relationships:
      hasMany: Order
  Locale:
    id: false
    code: string:12 primary
    name: string:100
  Country:
    id: false
    code: string:2 primary
    name: string:100
    enabled: boolean default:true
  Province:
    id: false
    code: string:255 primary
    name: string:255
    abbreviation: string:255 nullable
    relationships:
      belongsTo: Country
    indexes:
      - unique: country_code, name

controllers:
  Part:
    resource: paginate:parts
  PartWebpage:
    resource
  Customer:
    resource
  CustomerContactInfo:
    resource
  CustomerPaymentMethod:
    resource
  Monitor:
    resource
  MonitorSubscriber:
    resource
  ShoppingCart:
    addItem:
      find: customer_id
      redirect: shoppingCarts.show with:shoppingCart
    removeItem:
      find: customer_id
      redirect: shoppingCarts.show with:shoppingCart
    empty:
      find: customer_id
      redirect: shoppingCarts.show with:shoppingCart
    order:
      find: customer_id
      redirect: orders.show with:order
  Order:
    resource: index, store, show

seeders: PartType, Manufacturer, Currency, Locale, Country, Province
