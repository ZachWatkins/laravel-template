models:
  Part:
    status: enum:active,inactive default:active index
    number: string:100 index
    name: string:100
    sku: string:100
    inventory: integer
    price: decimal:8,2
    weight: decimal:8,2
    weight_unit: string:10
    filename: string:100
    published_at: nullable timestamp
    softDeletes
    relationships:
      belongsTo: PartType, Manufacturer
      hasOne: PartWebpage
      hasMany: OrderItem, PartInventoryMonitor
  PartType:
    name: string:100
    softDeletes
    relationships:
      hasMany: Part
  PartWebpage:
    status: enum:active,inactive default:active index
    path: string:100
    title: string:100
    meta_title: string:100
    meta_description: string:255
    meta_keywords: string:255
    content: text
    relationships:
      belongsTo: Part
  ShoppingCart:
    relationships:
      belongsTo: Customer
      belongsToMany: Part
    indexes:
      - unique: customer_id
  Order:
    number: integer default:1 index
    status: enum:paid,processing,shipped,delivered,canceled,returned,partially_refunded,refunded,completed default:paid index
    total: decimal:10,2
    notes: text
    relationships:
      belongsTo: Customer
      hasMany: OrderItem
      hasOne: OrderDestination, OrderPayment
    indexes:
      - unique: customer_id, number
  OrderItem:
    quantity: integer
    price: decimal:8,2
    number: string:100 index
    relationships:
      belongsTo: Order, Part
  OrderDestination:
    street_1: string:100
    street_2: string:100
    city: string:100
    state: string:100
    zip_code: string:10
    instructions: string:500
    relationships:
      belongsTo: Order
  OrderPayment:
    total: decimal:10,2
    billed_card_name: string:100
    billed_card_number: string:20
    billed_card_expiration: string:5
    billed_street_1: string:100
    billed_street_2: string:100
    billed_city: string:100
    billed_state: string:100
    billed_zip_code: string:10
    relationships:
      belongsTo: Order
  Customer:
    relationships:
      belongsTo: User
      hasOne: ShoppingCart, CustomerShippingDestination, CustomerPaymentMethod
      hasMany: Order
  CustomerContactInfo:
    phone: string:20
    relationships:
      belongsTo: Customer
  CustomerShippingDestination:
    street_1: string:100
    street_2: string:100
    city: string:100
    state: string:100
    zip_code: string:10
    instructions: string:500
    relationships:
      belongsTo: Customer
  CustomerPaymentMethod:
    total: decimal:10,2
    billing_card_name: string:100
    billing_card_number: string:20
    billing_card_expiration: string:5
    billing_street_1: string:100
    billing_street_2: string:100
    billing_city: string:100
    billing_state: string:100
    billing_zip_code: string:10
    relationships:
      belongsTo: Customer
  Manufacturer:
    name: string:100
    description: string:400
    filename: string:100
    softDeletes
    relationships:
      hasMany: Part
  PartInventoryMonitor:
    active: boolean default:true
    threshold: integer default:10
    relationships:
      hasMany: Part, MonitorSubscriber
  PartInventoryMonitorSubscriber:
    name: string:100
    email: string:100
    relationships:
      belongsTo: PartInventoryMonitor

controllers:
  Part:
    resource: paginate:parts
  PartWebpage:
    resource
  Customer:
    resource
  CustomerContactInfo:
    resource
  CustomerShippingDestination:
    resource
  CustomerPaymentMethod:
    resource
  ShoppingCart:
    resource
  Order:
    resource: index, show
  Monitor:
    resource
  MonitorSubscriber:
    resource

seeders: PartType
